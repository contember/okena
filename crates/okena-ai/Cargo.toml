[package]
name = "okena-ai"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
okena-core = { path = "../okena-core" }
okena-agent-usage = { path = "../okena-agent-usage" }
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
env_logger = "0.11"
fs2 = "0.4"
futures = "0.3"
getrandom = "0.2"
jiff = "0.2"
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
flate2 = "1.0"
tempfile = "3"
