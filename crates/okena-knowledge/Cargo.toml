[package]
name = "okena-knowledge"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Knowledge stores on disk (ADR-0003): store identity, project config, okena's
# store registry, discovery and the entry tree. GPUI-free and daemon-safe.

[dependencies]
okena-core = { path = "../okena-core" }
okena-git = { path = "../okena-git" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
log = "0.4"

[dev-dependencies]
tempfile = "3"
