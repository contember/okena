[package]
name = "okena-views-terminal"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
okena-core = { path = "../okena-core" }
okena-extensions = { path = "../okena-extensions" }
okena-terminal = { path = "../okena-terminal" }
okena-workspace = { path = "../okena-workspace" }
okena-ui = { path = "../okena-ui" }
okena-files = { path = "../okena-files" }

gpui = { workspace = true }
gpui-component = { workspace = true }

alacritty_terminal = "0.25"
parking_lot = "0.12"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
