[package]
name = "okena-hooks"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["gpui"]
gpui = ["dep:gpui"]

[dependencies]
okena-core = { path = "../okena-core" }
okena-terminal = { path = "../okena-terminal" }
okena-git = { path = "../okena-git" }
okena-state = { path = "../okena-state" }

gpui = { workspace = true, optional = true }

parking_lot = "0.12"
log = "0.4"
libc = "0.2"
base64 = "0.22"

[dev-dependencies]
anyhow = "1.0"
