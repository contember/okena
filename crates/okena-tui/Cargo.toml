[package]
name = "okena-tui"
version.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "okena-tui"
path = "src/main.rs"

[dependencies]
okena-core = { path = "../okena-core" }
okena-transport = { path = "../okena-transport", features = ["client"] }
okena-terminal = { path = "../okena-terminal" }

anyhow = "1.0"
async-channel = "2.3"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1.10", features = ["v4"] }
