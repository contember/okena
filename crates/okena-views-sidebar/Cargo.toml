[package]
name = "okena-views-sidebar"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
okena-core = { path = "../okena-core" }
okena-transport = { path = "../okena-transport", features = ["client", "blocking-http"] }
okena-services = { path = "../okena-services" }
okena-terminal = { path = "../okena-terminal" }
okena-ui = { path = "../okena-ui" }
okena-views-services = { path = "../okena-views-services" }
okena-views-terminal = { path = "../okena-views-terminal" }
okena-workspace = { path = "../okena-workspace" }

gpui = { workspace = true }
gpui-component = { workspace = true }

smol = "2.0"
log = "0.4"
serde_json = "1.0"
dirs = "5.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
