[package]
name = "okena-openspec"
version = "0.1.0"
edition = "2024"
license = "MIT"

# OpenSpec (https://github.com/Fission-AI/OpenSpec) on disk: the machine store
# registry, store identity, root discovery and the planning tree. GPUI-free and
# daemon-safe — it only touches the filesystem (and `git` during store setup).

[dependencies]
okena-core = { path = "../okena-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
dirs = "5.0"
log = "0.4"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
