# Run from modules/okena-mobile-ffi so generation cannot overwrite the app host.
rust:
  directory: ../../../..
  manifestPath: crates/okena-mobile-ffi/Cargo.toml

bindings:
  ts: src/generated
  cpp: cpp/generated

android:
  targets:
    - arm64-v8a
    - x86_64
  apiLevel: 24
  cargoExtras: [--locked]

ios:
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
  cargoExtras: [--locked]
