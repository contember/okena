name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # CI never reads debug symbols: dropping them shortens the test-binary links
  # and shrinks the dev cache. Release builds are unaffected.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Runs on every push: Linux clippy + split gates. Tests run in `test`, in
  # parallel: clippy metadata and test codegen share few build artifacts.
  #
  # Rust caches are saved from main only. Branch copies of the multi-GB Linux
  # cache pushed the repo past GitHub's 10 GB cache limit, which evicted main's
  # cache and turned runs cold. Branches and PRs restore main's cache.
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libfontconfig-dev \
            pkg-config \
            cmake

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web client
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Daemon/client split gates
        run: |
          scripts/audit-daemon-client-gaps.sh
          if cargo tree -p okena-daemon --edges no-dev | grep -E 'gpui|gpui-component'; then
            echo "okena-daemon must stay GPUI-free"
            exit 1
          fi
          # The `okena-cli` bin is the CLI for headless hosts that run
          # okena-daemon without the desktop app.
          if cargo tree -p okena-cli --edges no-dev | grep -E 'gpui|gpui-component'; then
            echo "okena-cli must stay GPUI-free"
            exit 1
          fi

  # Runs on every push: Linux tests.
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libfontconfig-dev \
            pkg-config \
            cmake

      # Test dependencies, not build ones: dtach backs the session-teardown
      # tests, zsh and fish the dropped-path quoting round-trip. Without them
      # those tests skip themselves and the job stays green having proved less.
      - name: Install test dependencies
        run: sudo apt-get install -y dtach zsh fish

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web client
        run: cd web && bun install --frozen-lockfile && bun run build

      # `cargo test` builds another package's bin target as a test harness, never
      # as a plain binary, so the end-to-end tests that drive the TUI would skip
      # themselves without this.
      - name: Build the TUI binary the end-to-end tests drive
        run: cargo build -p okena-tui

      # The workspace declares no `default-members`, so a bare `cargo test` would
      # run the root `okena` package alone and skip every member crate's tests.
      - name: Run tests
        env:
          # Turn a missing prerequisite from a silent skip into a failure.
          OKENA_REQUIRE_SHELLS: 1
          OKENA_REQUIRE_TUI: 1
        run: cargo test --workspace --no-fail-fast

  # Windows-only `cfg` branches never compile in the Linux `check` job above, so
  # a platform-specific break used to surface only once a tag started the full
  # matrix — too late, with the tag already pushed. Compile for Windows on every
  # push instead. Plain `cargo check`, not clippy: Windows still carries
  # pre-existing warnings that `-D warnings` would turn into failures.
  check-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-pc-windows-msvc-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # okena-remote-server embeds web/dist through RustEmbed, so the assets
      # have to exist before the Rust build.
      - name: Build web client
        run: cd web && bun install --frozen-lockfile && bun run build

      - name: Check compilation
        run: cargo check --workspace --all-targets

  # React Native mobile client — TypeScript checks.
  #
  # Native builds and signed beta artifacts run in android.yml and ios.yml.
  mobile-rn:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/rn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/rn/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Full multi-platform build: tags + manual trigger
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/desktop-build.yml

  # Create release when a tag is pushed
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag with a semver pre-release identifier (v1.0.0-beta.1) must ship as a
      # GitHub prerelease: the in-app updater and both install scripts read
      # /releases/latest, which skips prereleases, so this is what keeps a beta
      # from reaching everyone on the stable channel.
      - name: Classify release
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # The cask is the stable channel — a prerelease must not overwrite it.
      - name: Generate ContemberBot token
        id: app-token
        if: steps.meta.outputs.prerelease == 'false'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONTEMBER_BOT_APP_ID }}
          private-key: ${{ secrets.CONTEMBER_BOT_APP_PRIVATE_KEY }}
          owner: contember
          repositories: homebrew-okena

      - name: Update Homebrew tap
        if: steps.meta.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # Calculate SHA256 from local zip files
          ARM64_SHA=$(sha256sum okena-macos-arm64.zip | cut -d' ' -f1)
          X64_SHA=$(sha256sum okena-macos-x64.zip | cut -d' ' -f1)

          # Clone the tap repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/contember/homebrew-okena.git /tmp/homebrew-okena

          # Update cask
          sed -i "s/version \".*\"/version \"${VERSION}\"/" /tmp/homebrew-okena/Casks/okena.rb
          sed -i "s/sha256 arm:   \".*\",/sha256 arm:   \"${ARM64_SHA}\",/" /tmp/homebrew-okena/Casks/okena.rb
          sed -i "s/         intel: \".*\"/         intel: \"${X64_SHA}\"/" /tmp/homebrew-okena/Casks/okena.rb

          cat /tmp/homebrew-okena/Casks/okena.rb

          # Commit and push
          cd /tmp/homebrew-okena
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/okena.rb
          git commit -m "chore: update cask to v${VERSION}"
          git push origin main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            *.tar.gz
            *.zip
            *.dmg
            *.apk
            SHA256SUMS
          generate_release_notes: true
