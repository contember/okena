name: Nightly

# Builds the commit the run starts on (main HEAD) and publishes it as a GitHub
# prerelease tagged `nightly-YYYYMMDD-<sha7>`, but only when that commit's
# Build run on main completed green; otherwise the night is skipped. An older
# commit is never built: its tag would need the `workflows` permission the
# workflow token cannot hold. The desktop updater offers these builds to
# users on the Nightly channel. Install scripts and the Homebrew cask use stable releases.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      manifest: ${{ steps.identity.outputs.manifest }}
      skip: ${{ steps.pick.outputs.skip }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/nightly-gate.sh
            /Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Check that main HEAD has a green Build run
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$SHA&per_page=100" > runs.json
          decision=$(scripts/nightly-gate.sh "$REF" "$SHA" < runs.json)
          if [[ "$decision" != build ]]; then
            echo "::notice::No nightly tonight, ${decision#skip: }"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name | startswith(\"nightly-\") and endswith(\"-${SHA:0:7}\")) | .tag_name")
          if [[ -n "$existing" ]]; then
            echo "::notice::No nightly tonight, $SHA already has one: $existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$(date -u +%Y%m%d)-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Identify the nightly build
        id: identity
        if: steps.pick.outputs.skip == 'false'
        shell: python
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          import datetime
          import json
          import os
          import tomllib

          tag = os.environ["TAG"]
          with open("Cargo.toml", "rb") as cargo:
              base_version = tomllib.load(cargo)["workspace"]["package"]["version"]
          manifest = {
              "tag": tag,
              "date": datetime.datetime.strptime(tag.split("-")[1], "%Y%m%d").date().isoformat(),
              "sha": os.environ["GITHUB_SHA"],
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "base_version": base_version,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("manifest=" + json.dumps(manifest), file=output)

  build:
    needs: [resolve]
    if: needs.resolve.outputs.skip == 'false'
    uses: ./.github/workflows/desktop-build.yml
    with:
      nightly_manifest: ${{ needs.resolve.outputs.manifest }}

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # gh uploads the assets to a draft and publishes it last, so a nightly
      # never appears with a partial asset set. `--latest=false` keeps it from
      # ever becoming /releases/latest.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          MANIFEST: ${{ needs.resolve.outputs.manifest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Nightly build of $SHA from \`main\`, built by $RUN_URL."
            echo
            echo "Untested beyond CI. To follow these builds, select Nightly in Settings → Auto Update in a channel-aware desktop installation. For a manual install, download your platform archive and verify it against \`SHA256SUMS\`."
          } > notes.md
          printf '%s\n' "$MANIFEST" > nightly.json
          sha256sum nightly.json >> SHA256SUMS
          shopt -s nullglob
          gh release create "$TAG" --repo "$REPO" --target "$SHA" \
            --prerelease --latest=false \
            --title "$TAG" --notes-file notes.md \
            ./*.tar.gz ./*.zip ./*.dmg SHA256SUMS nightly.json

      - name: Keep the newest 14 nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("nightly-")) | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +15 | cut -f 2 > stale.txt
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
          done < stale.txt
