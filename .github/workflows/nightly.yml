name: Nightly

# Builds the commit the run starts on (main HEAD) and publishes it as a GitHub
# prerelease tagged `nightly-YYYYMMDD-<sha7>`, but only when that commit's
# Build run on main completed green; otherwise the night is skipped. An older
# commit is never built: its tag would need the `workflows` permission the
# workflow token cannot hold. Prereleases never reach users on their own: the
# in-app updater and both install scripts read /releases/latest and skip
# prereleases, and the Homebrew cask is bumped only by build.yml's stable
# release job.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nightly-gate.sh
          sparse-checkout-cone-mode: false

      - name: Check that main HEAD has a green Build run
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$SHA&per_page=100" > runs.json
          decision=$(scripts/nightly-gate.sh "$REF" "$SHA" < runs.json)
          if [[ "$decision" != build ]]; then
            echo "::notice::No nightly tonight, ${decision#skip: }"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name | startswith(\"nightly-\") and endswith(\"-${SHA:0:7}\")) | .tag_name")
          if [[ -n "$existing" ]]; then
            echo "::notice::No nightly tonight, $SHA already has one: $existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$(date -u +%Y%m%d)-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [resolve]
    if: needs.resolve.outputs.skip == 'false'
    uses: ./.github/workflows/desktop-build.yml

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # gh uploads the assets to a draft and publishes it last, so a nightly
      # never appears with a partial asset set. `--latest=false` keeps it from
      # ever becoming /releases/latest.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Nightly build of $SHA from \`main\`, built by $RUN_URL."
            echo
            echo "Untested beyond CI. The in-app updater, the install scripts and the Homebrew cask ignore nightlies; download an archive below and check it against \`SHA256SUMS\`."
          } > notes.md
          shopt -s nullglob
          gh release create "$TAG" --repo "$REPO" --target "$SHA" \
            --prerelease --latest=false \
            --title "$TAG" --notes-file notes.md \
            ./*.tar.gz ./*.zip ./*.dmg SHA256SUMS

      - name: Keep the newest 14 nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("nightly-")) | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +15 | cut -f 2 > stale.txt
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
          done < stale.txt
