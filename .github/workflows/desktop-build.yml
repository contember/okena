name: Desktop build

# The desktop build matrix and its packaging, shared by the tag release in
# build.yml and the nightly in nightly.yml. Produces one `release-assets`
# artifact: the archives, the DMGs and SHA256SUMS, ready to publish.

on:
  workflow_call:
    inputs:
      nightly_manifest:
        description: Contents of the nightly.json release asset
        type: string
        default: ''

# A called workflow does not inherit the caller's env.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner: the binary needs a glibc no newer than the build host's.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: okena-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: okena-macos-arm64
          # Cross-compiled on Apple Silicon: the same cold `Build app` step took
          # 19 to 90 min on the Intel runner and 6 to 21 min on arm64.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: okena-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: okena-windows-x64

    runs-on: ${{ matrix.os }}
    env:
      OKENA_NIGHTLY_MANIFEST: ${{ inputs.nightly_manifest }}
    # The cap stops a hung runner from holding the job for GitHub's 6-hour
    # default.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Record source commit
        shell: bash
        run: echo "OKENA_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      # Never saved: a cache saved from a tag is scoped to that tag, so no later
      # run can restore it, and its ~1 GB per target evicts main's caches.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.os }}
          save-if: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libfontconfig-dev \
            pkg-config \
            cmake

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web client
        run: cd web && bun install --frozen-lockfile && bun run build

      # Two invocations on purpose. Cargo unifies features across every package
      # selected in ONE invocation, so `-p okena -p okena-daemon` together would
      # turn on `okena-workspace/gpui` (which `okena` needs) for the daemon's
      # copy too — linking gpui and its X11/Wayland/Vulkan chain into the very
      # binary the GPUI-free gate exists to keep clean. The gate runs
      # `cargo tree -p okena-daemon` alone, so it would not see it.
      - name: Build app
        run: cargo build --release --target ${{ matrix.target }} -p okena

      - name: Build daemon (separate resolution — keeps it GPUI-free)
        run: cargo build --release --target ${{ matrix.target }} -p okena-daemon

      - uses: actions/setup-python@v5
        if: inputs.nightly_manifest != ''
        with:
          python-version: '3.12'

      # On the arm64 runner the x86_64 binaries run under Rosetta 2.
      - name: Verify nightly versions before packaging
        if: inputs.nightly_manifest != ''
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import json
          import os
          import pathlib
          import subprocess

          manifest = json.loads(os.environ["OKENA_NIGHTLY_MANIFEST"])
          short_sha = manifest["sha"][:7]
          assert manifest["tag"] == f"nightly-{manifest['date'].replace('-', '')}-{short_sha}"
          version = f"{manifest['base_version']} Nightly · {short_sha}"
          for name in ("okena", "okena-daemon"):
              path = pathlib.Path("target", os.environ["TARGET"], "release", name)
              if os.name == "nt":
                  path = path.with_suffix(".exe")
              actual = subprocess.check_output([path, "--version"], encoding="utf-8", timeout=15).strip()
              assert actual == f"{name} {version}", repr(actual)

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/icons
          cp target/${{ matrix.target }}/release/okena dist/
          chmod +x dist/okena
          # Ship the GPUI-free daemon sibling so the app runs the real daemon
          # binary instead of falling back to `okena --headless`.
          cp target/${{ matrix.target }}/release/okena-daemon dist/
          chmod +x dist/okena-daemon
          # Bundle icons for Linux installation
          cp assets/app-icon-16.png assets/app-icon-32.png assets/app-icon-48.png \
             assets/app-icon-64.png assets/app-icon-128.png assets/app-icon-256.png \
             assets/app-icon-512.png dist/icons/
          cp okena.desktop dist/

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/bundle-macos.sh
          ./scripts/bundle-macos.sh --target ${{ matrix.target }} --skip-build --dmg

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\okena.exe dist\
          # Ship the GPUI-free daemon sibling (see Linux step).
          copy target\${{ matrix.target }}\release\okena-daemon.exe dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  package:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # upload-artifact drops permission bits (files come back 0644), and the ZIP
      # and TAR below both record modes — so the exec bit has to be restored here,
      # between the download and the archiving, or it ships missing.
      - name: Restore executable bits
        run: |
          chmod +x artifacts/okena-linux-*/okena artifacts/okena-linux-*/okena-daemon
          chmod +x artifacts/okena-macos-*/Okena.app/Contents/MacOS/okena \
                   artifacts/okena-macos-*/Okena.app/Contents/MacOS/okena-daemon

      - name: Prepare release assets
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if [[ "$name" == *android* ]]; then
              # Move APKs to release root
              mv "$dir"/*.apk ../
            elif [[ "$name" == *ios* ]]; then
              # Move iOS zip to release root
              mv "$dir"/*.zip ../
            elif [[ "$name" == *windows* ]]; then
              zip -r "../${name}.zip" "$dir"
            elif [[ "$name" == *macos* ]]; then
              # macOS: DMG is already created, just move it
              mv "$dir"/*.dmg "../" 2>/dev/null || true
              # Also create a zip of the .app for those who prefer it
              cd "$dir" && zip -r "../../${name}.zip" "Okena.app" && cd ..
            else
              tar -czvf "../${name}.tar.gz" -C "$dir" .
            fi
          done

      # Guards the step above: the Homebrew cask and the shell installer both
      # unpack these archives directly, so a lost exec bit is a broken install.
      - name: Assert executable bits in release archives
        run: |
          failed=0
          assert_exec() {
            local archive="$1" entry="$2" mode
            case "$archive" in
              *.tar.gz) mode=$(tar -tvzf "$archive" | awk -v f="$entry" '$NF == f { print $1; exit }') ;;
              *) mode=$(unzip -Z "$archive" "$entry" 2>/dev/null | awk 'NR == 1 { print $1 }') ;;
            esac
            case "$mode" in
              -*x*) echo "ok    $archive :: $entry ($mode)" ;;
              *) echo "FAIL  $archive :: $entry (mode '${mode:-not found}')"; failed=1 ;;
            esac
          }

          shopt -s nullglob
          linux_archives=(okena-linux-*.tar.gz)
          macos_archives=(okena-macos-*.zip)
          [[ ${#linux_archives[@]} -gt 0 ]] || { echo "FAIL  no okena-linux-*.tar.gz produced"; failed=1; }
          [[ ${#macos_archives[@]} -gt 0 ]] || { echo "FAIL  no okena-macos-*.zip produced"; failed=1; }

          for archive in "${linux_archives[@]}"; do
            assert_exec "$archive" ./okena
            assert_exec "$archive" ./okena-daemon
          done
          for archive in "${macos_archives[@]}"; do
            assert_exec "$archive" Okena.app/Contents/MacOS/okena
            assert_exec "$archive" Okena.app/Contents/MacOS/okena-daemon
          done

          exit "$failed"

      # The in-app updater looks for an asset named exactly `SHA256SUMS` and
      # silently skips verification when it is absent (`platform_asset` in
      # crates/okena-ext-updater/src/checker.rs).
      - name: Generate SHA256SUMS
        run: |
          shopt -s nullglob
          assets=(*.tar.gz *.zip *.dmg *.apk)
          [[ ${#assets[@]} -gt 0 ]] || { echo "no release assets to checksum"; exit 1; }
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            *.tar.gz
            *.zip
            *.dmg
            *.apk
            SHA256SUMS
